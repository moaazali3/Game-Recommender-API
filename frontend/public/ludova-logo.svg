<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ludovaRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3" />
      <stop offset="35%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="ludovaDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
    <filter id="rubyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Base with Ruby Edge -->
  <polygon points="24,3 43,12 43,36 24,45 5,36 5,12" fill="url(#ludovaDark)" stroke="url(#ludovaRuby)" stroke-width="2.2" stroke-linejoin="round" />
  
  <!-- Subtle Internal Facet Accents -->
  <polygon points="24,5 41,13 24,24" fill="rgba(244, 63, 94, 0.12)" />
  <polygon points="5,35 24,43 24,24" fill="rgba(244, 63, 94, 0.06)" />

  <!-- Iconic 'L' Gaming Monogram in Ruby Neon -->
  <path d="M 16,13 L 22,13 L 22,29 L 32,29 L 32,35 L 16,35 Z" fill="url(#ludovaRuby)" filter="url(#rubyGlow)" />

  <!-- Center Gaming Core Crystal -->
  <polygon points="32,17 36,21 32,25 28,21" fill="#FECDD3" />
</svg>
