<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Story Timeline - Game Recommender</title>
    <meta name="description" content="A smart game recommendation engine and series timeline tracker based on Steam reviews and AI. Find what to play next!">
    <meta name="keywords" content="game recommendations, play next, game timeline, PC games, Steam alternatives">
    <meta property="og:title" content="Game Recommender - Series Timeline">
    <meta property="og:description" content="Discover your next favorite game and explore chronological series timelines.">
    <meta property="og:image" content="http://game-recommender.runasp.net/cover-image.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="bg-effects">
        <div class="bg-effects__orb bg-effects__orb--primary"></div>
        <div class="bg-effects__orb bg-effects__orb--secondary"></div>
    </div>

    <header class="top-nav-bar">
        <a href="https://ludova.runasp.net/" class="top-nav-brand">
            <img src="https://ludova.runasp.net/assets/images/logo.png" alt="Ludova Logo" class="top-nav-brand__logo">
            <span class="top-nav-brand__title">LUDOVA</span>
            <span class="top-nav-brand__badge">AI Recommender</span>
        </a>

        <nav class="top-nav">
            <button class="top-nav__btn" onclick="window.location.href='https://ludova.runasp.net/'" data-i18n="nav_ludova_hub">← Ludova Gateway</button>
            <button class="top-nav__btn" onclick="window.location.href='index.html'" data-i18n="back_to_search">Back to Search</button>
            <button class="top-nav__btn" onclick="window.location.href='library.html'" data-i18n="nav_library">Library</button>
            <button class="top-nav__btn" onclick="window.location.href='feedback.html'" data-i18n="nav_feedback">Feedback</button>
            <button id="langToggleBtn" class="top-nav__btn" data-i18n="lang_toggle">🌐 AR</button>
        </nav>
    </header>

    <main class="app-container">
        <section class="hero-section" style="min-height: 30vh; padding: 2rem 1rem;">
            <h1 id="timelineSeriesTitle" class="hero-section__title" data-i18n="series_timeline_title">Series Story <span class="hero-section__highlight">Timeline</span></h1>

            <div class="search-bar__container">
                <input type="text" id="seriesSearchInput" class="search-bar__input" placeholder="Enter Series Name (e.g., Dark Souls)"
                    autocomplete="off">
                <div id="seriesAutocompleteDropdown" class="search-bar__dropdown hidden"></div>
            </div>
        </section>

        <!-- Loading / Error states for main content -->
        <section id="seriesLoadingState" class="hidden" style="margin-top: 3rem;">
            <div class="loader" style="margin: 0 auto 1.5rem auto;">
                <div class="loader__pulse"></div>
            </div>
            <p style="text-align: center; color: var(--text-muted);">Loading series data...</p>
        </section>

        <section id="seriesErrorState" class="hidden error-card" style="margin: 2rem auto; width: 90%;">
            <h3 class="error-card__title">Error</h3>
            <p class="error-card__description">Could not fetch series data.</p>
        </section>

        <!-- Grid for all series (default view) -->
        <section id="allSeriesSection" class="hidden" style="width: 100%;">
            <h3 class="recommendations-section__title">All Series</h3>
            <div id="seriesGrid" class="recommendations-section__grid">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Timeline view (when a series is selected) -->
        <section id="timelineSection" class="hidden" style="width: 100%;">
            <div class="toggle-switch-wrapper" style="display: flex; align-items: center; justify-content: center; margin-bottom: 2rem; gap: 1rem;">
                <span class="toggle-switch-wrapper__label" style="color: var(--text-muted); font-size: 0.9rem;" data-i18n="show_all_games">Show all games</span>
                
                <label class="toggle-switch">
                    <input type="checkbox" id="mainlineToggle" class="toggle-switch__input">
                    <span class="toggle-switch__slider toggle-switch__slider--round"></span>
                </label>
                
                <span style="color: var(--accent); font-weight: bold; font-size: 0.9rem;" data-i18n="mainline_only">Mainline Games Only</span>
            </div>

            <div id="timelineLoadingState" class="hidden" style="margin-top: 3rem;">
                <div class="loader" style="margin: 0 auto 1.5rem auto;">
                    <div class="loader__pulse"></div>
                </div>
                <p style="text-align: center; color: var(--text-muted);">Charting the chronological path...</p>
            </div>

            <div id="timelineErrorState" class="hidden error-card" style="margin: 2rem auto; width: 90%;">
                <h3 class="error-card__title">Timeline Not Found</h3>
                <p class="error-card__description">Could not fetch the series timeline at this moment.</p>
            </div>

            <div id="timelineContainer" class="timeline hidden" style="margin-top: 2rem;">
                <!-- Injected via JS -->
            </div>
        </section>
    </main>

    <script src="lang.js?v=2"></script>
    <script src="series.js?v=2"></script>
</body>
</html>
