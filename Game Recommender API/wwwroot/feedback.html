<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Feedback - Game Recommender</title>
    <meta name="description" content="A smart game recommendation engine and series timeline tracker based on Steam reviews and AI. Find what to play next!">
    <meta name="keywords" content="game recommendations, play next, game timeline, PC games, Steam alternatives">
    <meta property="og:title" content="Game Recommender - Feedback">
    <meta property="og:description" content="Discover your next favorite game and explore chronological series timelines.">
    <meta property="og:image" content="http://game-recommender.runasp.net/cover-image.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMPFBZ8ZSD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VMPFBZ8ZSD');
    </script>
</head>
<body>
    <div class="bg-effects">
        <div class="bg-effects__orb bg-effects__orb--primary"></div>
        <div class="bg-effects__orb bg-effects__orb--secondary"></div>
    </div>

    <header class="top-nav-bar">
        <a href="https://ludova.runasp.net/" class="top-nav-brand">
            <img src="https://ludova.runasp.net/assets/images/logo.png" alt="Ludova Logo" class="top-nav-brand__logo">
            <span class="top-nav-brand__title">LUDOVA</span>
            <span class="top-nav-brand__badge">AI Recommender</span>
        </a>

        <nav class="top-nav">
            <button class="top-nav__btn" onclick="window.location.href='https://ludova.runasp.net/'" data-i18n="nav_ludova_hub">← Ludova Gateway</button>
            <button class="top-nav__btn" onclick="window.location.href='index.html'" data-i18n="back_to_search">Back to Search</button>
            <button class="top-nav__btn" onclick="window.location.href='series.html'" data-i18n="nav_timeline">Series Timeline</button>
            <button class="top-nav__btn" onclick="window.location.href='library.html'" data-i18n="nav_library">Library</button>
            <button id="langToggleBtn" class="top-nav__btn" data-i18n="lang_toggle">🌐 AR</button>
        </nav>
    </header>

    <main class="app-container">
        <section class="hero-section" style="margin-top: 8vh; margin-bottom: 2rem;">
            <p class="hero-section__subtitle" style="color: var(--text-muted); font-size: 1.2rem;" data-i18n="feedback_subtitle">Help us improve the gaming multiverse.</p>
        </section>

        <section class="feedback-form" style="width: 100%; max-width: 600px;">
            <div class="glass-panel" style="padding: 2.5rem;">
                <form id="feedbackForm">
                    <div style="margin-bottom: 2rem;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.8rem; color: white;" data-i18n="feedback_rate_label">Rate your experience</label>
                        <div class="feedback-form__rating" id="starRating">
                            <span class="feedback-form__star" data-value="1">★</span>
                            <span class="feedback-form__star" data-value="2">★</span>
                            <span class="feedback-form__star" data-value="3">★</span>
                            <span class="feedback-form__star" data-value="4">★</span>
                            <span class="feedback-form__star feedback-form__star--active" data-value="5">★</span>
                        </div>
                        <input type="hidden" id="ratingValue" value="5">
                    </div>

                    <div style="margin-bottom: 2rem;">
                        <label for="feedbackText" style="display: block; font-weight: 600; margin-bottom: 0.8rem; color: white;" data-i18n="feedback_thoughts_label">Your Thoughts</label>
                        <textarea id="feedbackText" rows="5" placeholder="Tell us what you think..." data-i18n="feedback_placeholder" style="width: 100%; padding: 1rem; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: white; font-family: inherit; font-size: 1rem; resize: vertical;" required></textarea>
                    </div>

                    <button type="submit" id="submitFeedbackBtn" data-i18n="feedback_send_btn" style="width: 100%;">Send Feedback</button>
                </form>

                <div id="feedbackSuccess" class="hidden" style="text-align: center; padding: 2rem 0;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2" style="width: 64px; height: 64px; margin-bottom: 1rem;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <h2 style="color: white; margin-bottom: 0.5rem;" data-i18n="feedback_thanks_title">Thank You!</h2>
                    <p style="color: var(--text-muted);" data-i18n="feedback_thanks_desc">Your feedback has been submitted successfully.</p>
                </div>
                
                <div id="feedbackError" class="hidden error-card" style="margin-top: 1rem; padding: 1.5rem;">
                    <h3 class="error-card__title" style="font-size: 1.2rem; margin-bottom: 0.5rem;" data-i18n="feedback_error_title">Error</h3>
                    <p class="error-card__description" data-i18n="feedback_error_desc">Failed to submit feedback. Please try again.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="lang.js?v=2"></script>
    <script src="feedback.js?v=2"></script>
</body>
</html>
